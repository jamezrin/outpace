[workspace]

[package]
name = "outpace-dht-compare"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[features]
default = []
candidates = ["dep:mainline", "dep:n0-mainline", "dep:tokio", "dep:futures-lite"]

[dependencies]
mainline = { version = "=8.0.1", optional = true }
n0-mainline = { version = "=0.6.0", optional = true }
tokio = { version = "1", features = ["rt", "macros", "time", "net"], optional = true }
futures-lite = { version = "2", optional = true }

[dev-dependencies]
serde_bencode = "=0.2.4"
