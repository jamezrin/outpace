[package]
name = "ace-engine"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true

[[bin]]
name = "outpace"
path = "src/main.rs"

[lib]
name = "ace_engine"
path = "src/lib.rs"

[features]
default = []
srt = ["dep:cc", "dep:shlex"]

[dependencies]
ace-log = { path = "../ace-log" }
ace-wire = { path = "../ace-wire" }
ace-media = { path = "../ace-media" }
ace-swarm = { path = "../ace-swarm" }
ace-peer = { path = "../ace-peer" }
tokio = { version = "1", features = ["full"] }
bytes = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
tower = { version = "0.5", features = ["util"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
form_urlencoded = "1"
dirs = "6"
rand = "0.10"
rtmp-rs = "0.6"
base64ct = { version = "1.8", features = ["alloc"] }
hex = "0.4"
libc = "0.2"
# Bounded decoding of gzip-encoded origin playlists only (see origin_hls/compression.rs).
flate2 = "1"
# Origin playlist reload fingerprints (already a dependency of ace-wire).
sha2 = "0.11"

# jemalloc is the default global allocator on 64-bit non-MSVC targets (see main.rs). 32-bit targets
# (e.g. armv7) are excluded: jemalloc's 64-bit `ffs` helper needs a `__ffsdi2` builtin that fails to
# link against static 32-bit musl. The default `background_threads_runtime_support` feature lets
# main.rs's exported `malloc_conf` turn the purge thread on where it is supported; do not force the
# `background_threads` feature, which compiles `background_thread:true` in on every target and makes
# Apple builds print a startup warning. `tikv-jemalloc-ctl` powers `/debug/memstats`.
[target.'cfg(all(not(target_env = "msvc"), target_pointer_width = "64"))'.dependencies]
tikv-jemallocator = "0.7"
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"] }

# Unprefixed symbols let jemalloc back plain `malloc` too. tikv-jemalloc-sys refuses them on Apple,
# Android and DragonFly (allocator-mixing crashes), so main.rs exports `_rjem_malloc_conf` there.
[target.'cfg(all(not(target_env = "msvc"), target_pointer_width = "64", not(any(target_vendor = "apple", target_os = "android", target_os = "dragonfly"))))'.dependencies]
tikv-jemallocator = { version = "0.7", features = ["unprefixed_malloc_on_supported_platforms"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
sha1 = "0.11"
ace-tracker = { path = "../ace-tracker" }

[build-dependencies]
cc = { version = "1", optional = true }
shlex = { version = "2", optional = true }
