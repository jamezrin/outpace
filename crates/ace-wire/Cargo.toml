[package]
name = "ace-wire"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true

[dependencies]
# RSA 0.9 requires digest 0.10 and rand_core 0.6; keep its signing inputs compatible.
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.11"
ed25519-dalek = { version = "3", features = ["rand_core"] }
# ed25519-dalek 2 also requires rand_core 0.6 for key generation.
rand = "0.8"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
rsa = "0.9"
pkcs8 = { version = "0.11", features = ["pem"] }

[dev-dependencies]
hex = "0.4"
