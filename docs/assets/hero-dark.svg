<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
<title id="t">Outpace</title>
<desc id="d">Outpace, an open-source peer-to-peer streaming engine, shown inside a live swarm: a broadcaster's pieces spread peer to peer, and Outpace downloads from four upstream peers, seeds to others and serves the stream as MPEG-TS and HLS.</desc>
