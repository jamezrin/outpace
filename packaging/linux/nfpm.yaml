# nfpm package definition for the .deb and .rpm release packages. Build with
# packaging/linux/build.sh, which stages the binary at target/package/outpace and sets
# VERSION and NFPM_ARCH. Paths are relative to the repository root.
name: outpace
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
release: "1"
section: net
priority: optional
maintainer: Outpace maintainers
description: |
  Open-source streaming engine for public Acestream content.
  Plays live and VOD streams over HTTP and HLS, ingests broadcasts over RTMP, and runs as
  a systemd service. The binary is statically linked (musl).
vendor: Outpace
homepage: https://github.com/jamezrin/outpace-stream
license: AGPL-3.0-or-later

contents:
  - src: target/package/outpace
    dst: /usr/bin/outpace
    file_info:
      mode: 0755
  - src: packaging/linux/outpace.service
    dst: /usr/lib/systemd/system/outpace.service
    file_info:
      mode: 0644
  - dst: /etc/outpace
    type: dir
    file_info:
      mode: 0750
      owner: root
      group: outpace
  - src: packaging/linux/outpace.env
    dst: /etc/outpace/outpace.env
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: outpace
  - src: LICENSE
    dst: /usr/share/doc/outpace/LICENSE
    file_info:
      mode: 0644

scripts:
  preinstall: packaging/linux/scripts/preinstall.sh
  postinstall: packaging/linux/scripts/postinstall.sh
  preremove: packaging/linux/scripts/preremove.sh
  postremove: packaging/linux/scripts/postremove.sh
