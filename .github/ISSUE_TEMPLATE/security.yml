name: Security report
description: Tell the maintainer you have a security issue to report privately. No details here.
labels: ["security"]
body:
  - type: markdown
    attributes:
      value: |
        **Don't describe the vulnerability in this issue.** Issues are public. Open this issue only to say you have a report, and the maintainer will arrange a private channel to receive the details.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: A broad area only, so the report can be routed. Pick "Prefer not to say" if even that reveals too much.
      options:
        - HTTP API
        - Peer wire or swarm
        - Broadcast ingest (RTMP, SRT, pulled sources)
        - Managed origin HLS
        - Packaging, container or release artifacts
        - Prefer not to say
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Outpace version
      placeholder: outpace 1.0.1
