name: Package manifest generator

on:
  pull_request:
    paths:
      - .github/workflows/package-manifests.yml
      - tools/release/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator:
    name: Release tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/release -p 'test_*.py'
