name: CI

# Merge gate for main (#163): rustfmt, Clippy and the offline test suite.
# No path filters, on purpose: when a path filter skips a workflow, its required
# checks stay "Pending" forever and block the pull request.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request cancels its stale run. Runs on main are
# never cancelled mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The job names are the check contexts that the main ruleset requires.
  # Renaming a job leaves the ruleset waiting on the old name and blocks every PR,
  # so update the ruleset in the same change.
  lint:
    name: Rust lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs the toolchain pinned in rust-toolchain.toml, with clippy and rustfmt.
      # The bundled Swatinem/rust-cache restores on every run but saves only from
      # main, so pull requests reuse main's cache without filling the cache quota.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: DHT comparison formatting
        run: cargo fmt --manifest-path tools/dhtcompare/Cargo.toml --check

      - name: DHT comparison Clippy
        run: cargo clippy --manifest-path tools/dhtcompare/Cargo.toml --all-features --all-targets --locked -- -D warnings

  test:
    name: Rust test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Same toolchain and cache policy as the lint job.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      # Keep media tests enabled without letting cloud-mirror downloads consume
      # the whole test job. The helper uses scoped signed Canonical sources first and
      # falls back to the kernel.org mirror only when the Canonical index fails.
      - name: Install ffmpeg
        timeout-minutes: 7
        run: python3 tools/ci/install_media_tools.py

      # Live-network tests are #[ignore]d, so the default run stays offline.
      - name: Test
        run: cargo test --workspace --locked

      # Real UDP cases require the separately owned offline namespace runner.
      - name: DHT comparison contracts
        run: cargo test --manifest-path tools/dhtcompare/Cargo.toml --all-features --locked

  # Release builds ship Apple binaries, whose jemalloc uses prefixed symbols and no purge
  # thread. Only a native macOS run proves the exported allocator configuration is applied.
  allocator-macos:
    name: Allocator (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Allocator configuration and startup
        run: cargo test -p ace-engine --locked --bin outpace --test allocator_startup

  abcompare:
    name: A/B harness test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Standard-library fixtures and loopback HTTP only; no public stream or Docker.
      - name: Test A/B capture and analysis
        run: python3 -m unittest discover -s tools/abcompare -v

      # Pure coordinator fault tests do not start namespaces or UDP workers.
      - name: Test DHT comparison qualification coordinator
        run: python3 -m unittest discover -s tools/dhtcompare -p test_qualification.py -v

      # Relay frames, destination policy, cross-language lists and fixture predicates only.
      - name: Test DHT live-boundary policy
        run: python3 -m unittest discover -s tools/dhtcompare -p 'test_live_[rf]*.py' -v

      - name: Test release archive verification
        run: python3 -m unittest discover -s tools/release -v

      - name: Test CI prerequisite orchestration
        run: python3 -m unittest discover -s tools/ci -v

  hls-audio-synthetic:
    name: HLS audio synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install synthetic media tools
        timeout-minutes: 7
        run: python3 tools/ci/install_media_tools.py
      # The opted-in suite verifies every required encoder/generator and ffprobe;
      # missing tools or capabilities are failures, never successful skips.
      - name: Synthetic codec and lifecycle acceptance
        env:
          OUTPACE_TEST_HLS_AUDIO_FFMPEG: "1"
        run: cargo test -p ace-engine --test hls_audio_ffmpeg --locked -- --nocapture
