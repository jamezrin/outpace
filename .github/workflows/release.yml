name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*.*.*-*"

permissions:
  contents: read

env:
  BIN_NAME: outpace
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/outpace-stream/outpace-engine

jobs:
  release-metadata:
    name: Validate release tag against Cargo metadata
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read Cargo version and validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          cargo_version="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "ace-engine") | .version')"

          if [[ -z "$cargo_version" || "$cargo_version" == "null" ]]; then
            echo "::error::Could not read the ace-engine version from cargo metadata."
            exit 1
          fi

          tag="$GITHUB_REF_NAME"
          expected="v${cargo_version}"
          if [[ "$tag" != "$expected" ]]; then
            echo "::error::Release tag ${tag} does not match the Cargo version (expected ${expected}). Update the [workspace.package] version in Cargo.toml or retag."
            exit 1
          fi

          echo "version=${cargo_version}" >> "$GITHUB_OUTPUT"
          echo "Release version (from Cargo metadata): ${cargo_version}"

  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: release-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            archive: tar.gz
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-24.04
            archive: tar.gz
          - target: arm-unknown-linux-musleabihf
            os: ubuntu-24.04
            archive: tar.gz
          - target: riscv64gc-unknown-linux-musl
            os: ubuntu-24.04
            archive: tar.gz
          # Built against the FreeBSD 14 sysroot so one binary runs on FreeBSD 14 and 15
          # (including pfSense and OPNsense).
          - target: x86_64-unknown-freebsd
            cross: x86_64-unknown-freebsd@14
            os: ubuntu-24.04
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
          cache: false
          build-warnings: ""

      - name: Install cross toolchain
        if: contains(matrix.target, 'unknown-linux-musl') || matrix.cross
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.cross || matrix.target }}

      - name: Test Windows executable resolution
        if: contains(matrix.target, 'windows')
        shell: bash
        run: cargo test --locked -p ace-engine --lib --target "${{ matrix.target }}" executable_resolution_tests

      - name: Build release binary
        shell: bash
        run: |
          # The dist profile (Cargo.toml) is the size-optimised release profile.
          cargo build --locked --profile dist -p ace-engine --bin "$BIN_NAME" --target "${{ matrix.target }}"

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.release-metadata.outputs.version }}"
          target="${{ matrix.target }}"
          binary="target/${target}/dist/${BIN_NAME}"

          if [[ "$target" == *windows* ]]; then
            binary="${binary}.exe"
          fi

          package_dir="dist/${BIN_NAME}-${version}-${target}"
          mkdir -p "$package_dir"
          cp "$binary" "$package_dir/"
          cp LICENSE README.md "$package_dir/"

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path '${package_dir}' -DestinationPath 'dist/${BIN_NAME}-${version}-${target}.zip' -Force"
          else
            tar -C dist -czf "dist/${BIN_NAME}-${version}-${target}.tar.gz" "${BIN_NAME}-${version}-${target}"
          fi

      - name: Upload packaged binary
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ env.BIN_NAME }}-${{ needs.release-metadata.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0

  linux-packages:
    # .deb and .rpm packages (packaging/linux/) around the static musl archives built above.
    # Named outpace_<version>_<arch>.<deb|rpm>, outside the outpace-* archive pattern.
    name: Package ${{ matrix.target }}
    runs-on: ubuntu-26.04
    needs:
      - release-metadata
      - build-binaries
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download packaged binary
        uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.target }}
          path: archive

      - name: Install nfpm
        run: echo "$(packaging/linux/install-nfpm.sh "$RUNNER_TEMP/nfpm")" >> "$GITHUB_PATH"

      - name: Build packages
        shell: bash
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tar -xzf "archive/${BIN_NAME}-${VERSION}-${TARGET}.tar.gz" -C archive
          packaging/linux/build.sh "$TARGET" "$VERSION" \
            "archive/${BIN_NAME}-${VERSION}-${TARGET}/${BIN_NAME}" packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: release-packages-${{ matrix.target }}
          path: packages/outpace_*
          if-no-files-found: error
          compression-level: 0

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-26.04
    needs:
      - release-metadata
      - build-binaries
      - linux-packages
    permissions:
      contents: write
      # Signed build provenance for the archives (GitHub artifact attestations).
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download packaged binaries
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum outpace-* outpace_* > SHA256SUMS
          cat SHA256SUMS

      # Records which workflow run and commit built each archive and package. Verify with
      # `gh attestation verify <file> --repo <owner>/<repo>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/outpace-*
            dist/outpace_*

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          body_path: docs/releases/${{ needs.release-metadata.outputs.version }}.md
          generate_release_notes: true
          files: |
            dist/outpace-*
            dist/outpace_*
            dist/SHA256SUMS

  publish-container:
    name: Publish GHCR image from release archives
    # publish-release depends on every binary build succeeding.
    needs: publish-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-container.yml
    with:
      tag: ${{ github.ref_name }}

  best-effort-android:
    # Android engines for Termux and the Android app (outpace-stream/outpace-android), which
    # downloads these archives by name (outpace-<version>-<target>.tar.gz plus .sha256), so
    # their names and layout are an interface. Runs only after the release and its container
    # image exist, so a failure can never block either. Builds with a read-only token; the
    # separate upload job below is the only one that can write to the release.
    name: Best-effort ${{ matrix.target }}
    runs-on: ubuntu-26.04
    needs:
      - release-metadata
      - publish-container
    continue-on-error: true
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, armv7-linux-androideabi]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ env.TARGET }}
          cache: false
          build-warnings: ""

      - name: Install Android cross toolchain
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ env.TARGET }}

      - name: Build release binary
        run: cargo build --locked --release -p ace-engine --bin "$BIN_NAME" --target "$TARGET"

      # Not covered by SHA256SUMS: the archive gets its own .sha256 file.
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          name="${BIN_NAME}-${VERSION}-${TARGET}"
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/release/${BIN_NAME}" LICENSE README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")

      - name: Upload packaged binary
        uses: actions/upload-artifact@v7
        with:
          name: best-effort-android-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  upload-best-effort-android:
    # Write-scoped, but runs no build steps or toolchain actions: it only attaches the
    # archives built above. Each target is best-effort, so it uploads whichever were built.
    name: Upload best-effort Android archives
    runs-on: ubuntu-26.04
    needs: best-effort-android
    if: ${{ !cancelled() }}
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v8
        with:
          pattern: best-effort-android-*
          merge-multiple: true
          path: dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.tar.gz dist/*.tar.gz.sha256)
          if (( ${#files[@]} == 0 )); then
            echo "::warning::No best-effort Android archives were built."
            exit 0
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY"
