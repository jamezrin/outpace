name: BSD portability

# Cross-builds the BSD release targets on PRs that can change them, and starts the
# FreeBSD binary inside a FreeBSD VM. Mirrors the BSD rows of release.yml.
on:
  pull_request:
    paths:
      - .github/workflows/bsd.yml
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - tools/ci/smoke_daemon.sh
      - packaging/freebsd/**
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cross-build:
    name: Cross-build ${{ matrix.target }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-freebsd
            cross: x86_64-unknown-freebsd@14
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
          cache: false
          build-warnings: ""

      - name: Install cross toolchain
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.cross }}

      - name: Cross-build release binary
        run: cargo build --locked --release -p ace-engine --bin outpace --target "${{ matrix.target }}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: outpace-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/outpace
          if-no-files-found: error
          retention-days: 1

  freebsd-smoke:
    name: FreeBSD ${{ matrix.release }} startup and health smoke
    needs: cross-build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported majors the FreeBSD 14 build is meant to cover.
        release: ["14.3", "15.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download FreeBSD binary
        uses: actions/download-artifact@v8
        with:
          name: outpace-x86_64-unknown-freebsd
          path: freebsd-bin

      - name: Start daemon in a FreeBSD VM and check health
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          prepare: pkg install -y curl
          run: |
            set -eu
            chmod +x freebsd-bin/outpace
            sh tools/ci/smoke_daemon.sh freebsd-bin/outpace
            # The documented rc.d service: daemon(8) as root, outpace as its own user.
            install -m 0755 freebsd-bin/outpace /usr/local/bin/outpace
            pw useradd outpace -d /var/db/outpace -s /usr/sbin/nologin
            install -d -o outpace -g outpace -m 0700 /var/db/outpace
            install -m 0755 packaging/freebsd/outpace /usr/local/etc/rc.d/outpace
            sysrc outpace_enable=YES
            service outpace start
            ok=0
            for i in $(seq 60); do
              if curl --fail --silent --max-time 2 http://127.0.0.1:6878/healthz; then ok=1; break; fi
              sleep 1
            done
            cat /var/log/outpace.log || true
            [ "$ok" = 1 ] || { echo "rc.d service did not answer /healthz" >&2; exit 1; }
            test -s /var/run/outpace.pid
            # -P records the supervisor, which must be root; the daemon must run as outpace.
            [ "$(ps -o user= -p "$(cat /var/run/outpace.pid)" | tr -d ' ')" = root ]
            pgrep -U outpace -x outpace >/dev/null || { ps -axo user,pid,command | grep outpace; exit 1; }
            service outpace stop
            sleep 2
            if curl --fail --silent --max-time 2 http://127.0.0.1:6878/healthz; then
              echo "outpace still running after service stop" >&2
              exit 1
            fi
