name: Edge image

# Moving linux/amd64 image for deployments that track main. Version tags remain
# the pinned multi-arch images published by release.yml. A newer push cancels an
# in-flight build so an older commit cannot publish over a newer one.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: edge-image
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/jamezrin/outpace

jobs:
  publish:
    name: Publish edge image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          tags: |
            type=raw,value=edge
            type=sha,prefix=sha-,format=long

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=edge
          cache-to: type=gha,scope=edge,mode=max
