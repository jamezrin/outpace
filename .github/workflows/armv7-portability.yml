name: ARMv7 portability

on:
  # Only run when something that can change the shipped ARMv7 binary
  # moves. Tests, docs, and dev-only tooling do not affect the release build,
  # so changes limited to those paths skip this portability gate.
  pull_request:
    paths:
      - .github/workflows/armv7-portability.yml
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cross-build:
    # Keep the name for the ARMv7 leg stable; other small-device release targets share it.
    name: Cross-build ${{ matrix.label }} release binary
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7-unknown-linux-musleabihf
            label: ARMv7
          - target: arm-unknown-linux-musleabihf
            label: ARMv6
          - target: riscv64gc-unknown-linux-musl
            label: RISC-V 64
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ env.TARGET }}
          cache: false
          build-warnings: ""

      - name: Install ARMv7 musl toolchain
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ env.TARGET }}

      - name: Cross-build release binary
        run: cargo build --locked --release -p ace-engine --bin outpace --target "$TARGET"

      # The cross toolchain action registers a QEMU user-mode runner for the target.
      - name: Run the emulated binary
        shell: bash
        run: |
          set -euo pipefail
          runner_var="CARGO_TARGET_$(tr 'a-z-' 'A-Z_' <<<"$TARGET")_RUNNER"
          ${!runner_var:-} "target/$TARGET/release/outpace" --version
