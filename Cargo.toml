[workspace]
members = ["crates/ace-log", "crates/ace-wire", "crates/ace-tracker", "crates/ace-peer", "crates/ace-media", "crates/ace-engine", "crates/ace-swarm", "tools/swarmtest", "crates/ace-fuzz"]
resolver = "2"

[workspace.package]
version = "1.1.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/outpace-stream/outpace-engine"

# Profile for published release binaries (release.yml). It trades a slower, single-unit
# link-time-optimised build for a smaller and slightly faster binary, which matters on
# routers and small boards. `cargo build --release`, the source Dockerfile and the edge
# image keep the default release profile so their build times do not change.
# panic stays "unwind": a panicking task must not abort the whole daemon.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
